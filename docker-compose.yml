services:
  db:
    image: postgis/postgis:16-3.4
    # Apple Silicon (M1/M2/M3) and the image won't start? Uncomment:
    # platform: linux/amd64
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
